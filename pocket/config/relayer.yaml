# date-math relayer — adapted from pokt-network/pocket-relay-miner examples/docker-compose.
# Beta by default. For MainNet switch every line marked "Mainnet:".
# Validate: docker compose run --rm relayer relayer validate --config /config/relayer.yaml --check-stake
listen_addr: "0.0.0.0:8080"

redis:
  url: "redis://redis:6379"

pocket_node:
  # Mainnet: "https://sauron-rpc.infra.pocket.network"
  query_node_rpc_url: "https://sauron-rpc.beta.infra.pocket.network"
  # Mainnet: "sauron-grpc.infra.pocket.network:443"
  query_node_grpc_url: "sauron-grpc.beta.infra.pocket.network:443"
  grpc_insecure: false

keys:
  keys_file: "/keys/supplier-keys.yaml"

services:
  date-math:
    validation_mode: eager
    default_backend: rest
    backends:
      rest:
        # CHANGE: your deployed Worker URL (no trailing slash).
        url: "https://date-math.datemath.workers.dev"
        health_check:
          enabled: true
          endpoint: "/v1/health"
          expected_body: '"ok"'
          interval_seconds: 10
          timeout_seconds: 5
          unhealthy_threshold: 3
          healthy_threshold: 2

health_check:
  enabled: true
  addr: "0.0.0.0:8081"

metrics:
  enabled: true
  addr: "0.0.0.0:9090"

pprof:
  enabled: true
  addr: "127.0.0.1:6060"

logging:
  level: "info"
  format: "json"
